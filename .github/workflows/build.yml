name: Source package

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: source-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject declarative UI dependencies
        shell: bash
        run: |
          forbidden=(
            "$(printf '\123\167\151\146\164\125\111')"
            "$(printf '\116\123\110\157\163\164\151\156\147')"
            "$(printf '\125\111\110\157\163\164\151\156\147')"
          )
          for needle in "${forbidden[@]}"; do
            if git grep -Iil "$needle" || git ls-files | grep -i "$needle"; then
              exit 1
            fi
          done

  build-macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Build with strict Swift 6 concurrency
        run: swift build --disable-index-store

  build-ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Build with strict Swift 6 concurrency
        run: |
          xcodebuild \
            -scheme Sentry \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/sentry-derived-data" \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build
