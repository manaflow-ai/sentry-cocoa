# This workflow is used to update the custom tooling versions for the project.
#
# We prefer to use Dependabot to update external dependencies, but at this time it does not include Homebrew as a supported package manager (https://docs.github.com/en/code-security/dependabot/ecosystems-supported-by-dependabot/supported-ecosystems-and-repositories).
# Furthermore, neither `swiftlint` nor `clang-format` are listed as dependencies in our repository, therefore also not picked up by Dependabot.
#
# Therefore we are using a custom workflow to update relevant files and open a pull request with the changes.

name: "Automation: Update tooling versions"

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  pull_request:

# Pull-request runs only inspect the base revision to calculate file filters. The updater job
# is limited to trusted schedule and manual runs below, so contributor-controlled Makefiles
# never execute with a write-capable token.
permissions:
  contents: read
  pull-requests: read

# Concurrency configuration:
# - For pull requests, we use a workflow-and-ref–scoped group to keep runs isolated per PR while
#   still cancelling outdated runs on the same PR.
# - For non-PR events (schedule, workflow_dispatch, pushes), we use a fixed global group so only
#   one repository-wide run can execute at a time, preventing race conditions when creating
#   branches and pull requests.
# - We enable cancellation of in-progress runs because only the most recent run matters for
#   version updates. This conserves GitHub Actions minutes and ensures we always work with the
#   latest repository state.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-{1}', github.workflow, github.ref) || 'auto-update-tools' }}
  cancel-in-progress: true

jobs:
  # This job detects if the PR contains changes that require tooling validation.
  # The filter file is read from the trusted base revision above.
  files-changed:
    name: Detect File Changes
    runs-on: ubuntu-latest
    # Map a step output to a job output
    outputs:
      run_auto_update_tools_for_prs: ${{ steps.changes.outputs.run_auto_update_tools_for_prs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The filter configuration must come from a trusted revision. dorny/paths-filter
          # reads the PR diff through the API, so no contributor code is needed here.
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Get changed files
        id: changes
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          token: ${{ github.token }}
          filters: .github/file-filters.yml

  auto-update-tools:
    # Never run the Makefile from a pull request. Schedule and manual dispatch are the only
    # events allowed to receive write permissions and create update branches.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: files-changed
    runs-on: macos-15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Generate GitHub App Token
        id: app_token
        if: github.event_name != 'pull_request'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.SENTRY_DEPENDENCY_UPDATER_GITHUB_APP_ID }}
          private-key: ${{ secrets.SENTRY_DEPENDENCY_UPDATER_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app_token.outputs.token }}
          persist-credentials: false

      - name: Install Tools
        run: make init

      - name: Update tooling versions
        run: make update-versions

      - name: Check tooling versions
        run: make check-versions

      - name: Print git status and changes
        run: |
          git status
          git diff HEAD

      - name: Create pull request for clang-format version
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        with:
          token: ${{ steps.app_token.outputs.token }}
          add-paths: scripts/.clang-format-version
          branch: github-actions/auto-update-tools-clang-format
          commit-message: "chore(deps): Update clang-format version"
          delete-branch: true
          title: "chore(deps): Update clang-format version"
          sign-commits: true
          base: main

      - name: Create pull request for swiftlint version
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        with:
          token: ${{ steps.app_token.outputs.token }}
          add-paths: scripts/.swiftlint-version
          branch: github-actions/auto-update-tools-swiftlint
          commit-message: "chore(deps): Update swiftlint version"
          delete-branch: true
          title: "chore(deps): Update swiftlint version"
          sign-commits: true
          base: main

      - name: Create pull request for xcodegen version
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        with:
          token: ${{ steps.app_token.outputs.token }}
          add-paths: scripts/.xcodegen-version
          branch: github-actions/auto-update-tools-xcodegen
          commit-message: "chore(deps): Update xcodegen version"
          delete-branch: true
          title: "chore(deps): Update xcodegen version"
          sign-commits: true
          base: main

      - name: Run CI Diagnostics
        uses: ./.github/actions/ci-diagnostics
        if: failure()

  auto-update-tools-pr-validation:
    name: Validate tooling versions (PR)
    # Validate contributor changes only on an isolated, read-only GitHub-hosted runner. The
    # write-capable updater above never executes for pull requests.
    if: github.event_name == 'pull_request' && needs.files-changed.outputs.run_auto_update_tools_for_prs == 'true'
    needs: files-changed
    runs-on: macos-15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install Tools
        run: make init
      - name: Update tooling versions
        run: make update-versions
      - name: Check tooling versions
        run: make check-versions
      - name: Print git status and changes
        run: |
          git status
          git diff HEAD
      - name: Run CI Diagnostics
        uses: ./.github/actions/ci-diagnostics
        if: failure()

  # This check validates that the trusted updater or the read-only PR validation passed or was
  # skipped, which lets the aggregate check remain required without running either job for
  # unrelated changes.
  auto_update_tools-required-check:
    needs: [files-changed, auto-update-tools, auto-update-tools-pr-validation]
    name: Auto Update Tools
    # This is necessary since a failed/skipped dependent job would cause this job to be skipped
    if: always()
    runs-on: ubuntu-latest
    steps:
      # If any jobs we depend on fails gets cancelled or times out, this job will fail.
      # Skipped jobs are not considered failures.
      - name: Check for failures
        if: >-
          needs.files-changed.result == 'failure' || needs.files-changed.result == 'cancelled' ||
          needs.auto-update-tools.result == 'failure' || needs.auto-update-tools.result == 'cancelled' ||
          needs.auto-update-tools-pr-validation.result == 'failure' ||
          needs.auto-update-tools-pr-validation.result == 'cancelled'
        run: |
          echo "One of the auto-update-tools jobs has failed." && exit 1
